name: dynamic-biomes
version: "${version}"
main: io.github.henriquemichelini.dynamicbiomes.pluginruntime.lifecycle.infrastructure.DynamicBiomes
api-version: "1.21"
commands:
  dynamicbiomes:
    description: Shows DynamicBiomes information and runs administration commands
    usage: /dynamicbiomes <season|biome|inspect|diagnostics|reload>
    aliases: [db]
permissions:
  dynamicbiomes.admin.diagnostics:
    description: Shows DynamicBiomes diagnostics
    default: op
  dynamicbiomes.admin.reload:
    description: Reloads DynamicBiomes configuration
    default: op
  dynamicbiomes.admin.season:
    description: Sets the current DynamicBiomes season
    default: op
